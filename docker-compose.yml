services:
  # The vector database. Stores document chunks as embeddings and
  # determines the chunks most similar to a query
  db:
    image: chromadb/chroma:latest
    volumes:
      - chroma-data:/data   # persistent storage for uploaded data 
    ports:
      - "8001:8000"         # doesn't collide with the backend's own 8000

  # The FastAPI backend: talks to ChromaDB and to Groq
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app       # bind mount: edits to backend/*.py on your
                             # machine are reflected instantly inside the
                             # container, and --reload picks them up
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}   # pulled from the .env file above
    depends_on:
      - db

  # The React frontend, served by Vite's dev server
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    depends_on:
      - backend

volumes:
  chroma-data: